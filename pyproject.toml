[project]
name = "mtl-park-map"
version = "0.1.0"
description = "Montreal parking sign & paid-spot map — FastAPI backend + React SPA"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "polars>=1.42.0",
    "pyarrow>=22.0.0",
    "pydantic>=2.9",
    "geojson>=3.2.0",
    "geopy>=2.4.1",
    "orjson>=3.11.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.14.6",
    "ty>=0.0.59",
]
# The stashed QT prototype under legacy/qt_app/ needs these; the web backend does not.
legacy = [
    "pyside6>=6.10.0",
    "folium>=0.20.0",
    "geopandas>=1.1.1",
    "osmnx>=2.0.6",
    "pandas>=2.3.3",
    "pandas-stubs>=2.3.2.250926",
    "duckdb>=1.4.2",
    "notebook>=7.4.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
