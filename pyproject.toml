[project]
name = "mtl-park-map"
version = "0.1.0"
description = "Montreal parking sign & paid-spot map — native PySide6 desktop app"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "polars>=1.42.0",
    "geopy>=2.4.1",
    "pyside6-essentials>=6.10.0",
]

[project.scripts]
mtl-park-map = "mtl_park_map.ui.app:main"

# Installing the project (editable, via `uv sync`) makes `mtl_park_map` importable
# from anywhere, e.g. when an IDE runs `mtl_park_map/__main__.py` as a script.
[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""  # flat layout: the package sits at the repo root, not under src/

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "ruff>=0.14.6",
    "ty>=0.0.59",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
qt_api = "pyside6"

[tool.ruff]
target-version = "py313"
